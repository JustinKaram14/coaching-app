name: Send Push Reminders

# Der automatische Zeitplan läuft seit 10.10.2026 in Supabase (pg_cron, Job "send-reminders", alle 15 Minuten).
# Dieser Workflow bleibt für einen manuellen Start über "Run workflow".
on:
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Plan and send reminders
        run: |
          # --fail-with-body: bei einem Fehler (z. B. 401) schlägt der Lauf rot fehl und zeigt die Antwort an
          curl -sS --fail-with-body -X POST "${{ secrets.VITE_SUPABASE_URL }}/functions/v1/send-reminders" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"type":"all"}'
          echo
