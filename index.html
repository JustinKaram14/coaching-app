    <script>

    <style>
      /* Startanimation „HLX Together – Healthy & Athletic". Steht inline, damit sie sichtbar ist,
         noch bevor das App-Bundle geladen ist. Der Hintergrund der Seite gilt nur bis die App-CSS greift.
         Ablauf: HLX wächst → wandert nach oben → HEALTHY & ATHLETIC groß → Kreis öffnet die App. */
      body { background: #075640; }
      #splash {
        position: fixed; inset: 0; z-index: 99999; display: grid; place-items: center; overflow: hidden;
        background: #075640; color: #fff; cursor: pointer;
        font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
        transition: opacity .4s ease;
      }
      #splash.sp-out { opacity: 0; pointer-events: none; }
      #splash::before {
        content: ""; position: absolute; inset: 0; opacity: 0;
        background: radial-gradient(circle at 50% 40%, #0b6f52 0%, #075640 50%, #04392a 100%);
        animation: sp-fade 1s ease-out .1s forwards;
      }
      /* Weiche Lichtpunkte, die langsam steigen */
      .sp-bokeh { position: absolute; inset: 0; pointer-events: none; }
      .sp-bokeh i {
        position: absolute; border-radius: 50%; opacity: 0;
        background: radial-gradient(circle, rgb(255 255 255 / .26) 0%, rgb(255 255 255 / 0) 68%);
        animation: sp-fade 1.4s ease .3s forwards, sp-float var(--d, 7s) ease-in-out infinite alternate;
      }
      .sp-art { position: relative; width: auto; height: min(70dvh, 560px); max-width: 94vw; overflow: visible; }
      .sp-leaving .sp-art { animation: sp-zoom .75s cubic-bezier(.5, 0, .75, 0) forwards; }

      /* HLX: Balken wachsen, dann wandert die Marke nach oben */
      .sp-mark {
        transform-origin: 0 0; transform: translate(36.5px, 190px) scale(.78);
        animation: sp-mark-move .65s cubic-bezier(.65, 0, .25, 1) .95s both;
      }
      .sp-bar, .sp-barx {
        fill: #fff; transform-box: fill-box; animation-duration: .45s;
        animation-timing-function: cubic-bezier(.2, .9, .25, 1.12); animation-fill-mode: both;
      }
      .sp-bar { transform-origin: 50% 100%; animation-name: sp-grow-y; }
      .sp-barx { transform-origin: 0 50%; animation-name: sp-grow-x; }
      .b1 { animation-delay: .15s } .b2 { animation-delay: .23s } .b3 { animation-delay: .36s }
      .b4 { animation-delay: .29s } .b5 { animation-delay: .42s } .b6 { animation-delay: .33s } .b7 { animation-delay: .40s }
      .sp-tg { font-size: 11px; font-weight: 700; letter-spacing: .5em; fill: #c4ecdd; animation: sp-up .5s ease-out 1.5s both; }

      /* Hauptmotiv: Wörter fahren aus einer Maske nach oben */
      .sp-hero { font-size: 66px; font-weight: 800; letter-spacing: -.01em; animation: sp-rise .7s cubic-bezier(.16, 1, .3, 1) both; }
      .h1 { fill: #fff; animation-delay: 1.1s; }
      .h2 { fill: #3bd4a6; animation-delay: 1.85s; }
      .sp-pulse {
        fill: none; stroke: #3bd4a6; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round;
        stroke-dasharray: 100; stroke-dashoffset: 100; filter: drop-shadow(0 0 6px rgb(59 212 166 / .65));
        animation: sp-draw .7s cubic-bezier(.4, .1, .2, 1) 1.5s forwards;
      }
      .sp-amp {
        font-size: 44px; font-weight: 300; fill: #fff; transform-box: fill-box; transform-origin: center;
        animation: sp-pop .45s cubic-bezier(.2, 1.3, .3, 1) 1.7s both;
      }
      .sp-ic {
        fill: none; stroke: #3bd4a6; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round;
        stroke-dasharray: 100; stroke-dashoffset: 100; animation: sp-draw .6s ease-out both;
      }
      .ic1 { animation-delay: 1.75s } .ic2 { animation-delay: 2.05s }
      .sp-beat { transform-box: fill-box; transform-origin: center; animation: sp-beat .7s ease-in-out 2.2s 2 both; }
      .sp-lift { transform-box: fill-box; transform-origin: center; animation: sp-lift .8s cubic-bezier(.3, 0, .2, 1) 2.35s both; }

      .sp-foot {
        position: absolute; left: 0; right: 0; bottom: calc(28px + env(safe-area-inset-bottom, 0px));
        display: grid; justify-items: center; gap: 12px; transition: opacity .25s ease;
      }
      .sp-leaving .sp-foot { opacity: 0; }
      .sp-hint { font-size: 12.5px; font-weight: 600; letter-spacing: .02em; color: #cfeee3; animation: sp-fade .5s ease .8s both; }
      .sp-track { width: 120px; height: 3px; border-radius: 3px; background: rgb(255 255 255 / .18); overflow: hidden; }
      .sp-fill { display: block; height: 100%; background: #3bd4a6; transform-origin: 0 50%; animation: sp-bar 2.9s linear both; }

      /* Übergang: Die App öffnet sich als wachsender Kreis über dem Startbild */
      html.sp-reveal #root { position: relative; z-index: 100000; animation: sp-circle .75s cubic-bezier(.7, 0, .2, 1) both; }

      @keyframes sp-draw { to { stroke-dashoffset: 0 } }
      @keyframes sp-grow-y { from { transform: scaleY(0) } to { transform: scaleY(1) } }
      @keyframes sp-grow-x { from { transform: scaleX(0) } to { transform: scaleX(1) } }
      @keyframes sp-mark-move { from { transform: translate(36.5px, 190px) scale(.78) } to { transform: translate(143px, 40px) scale(.2) } }
      @keyframes sp-up { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
      @keyframes sp-rise { from { transform: translateY(90px) } to { transform: none } }
      @keyframes sp-pop { from { opacity: 0; transform: scale(.4) } to { opacity: 1; transform: none } }
      @keyframes sp-beat { 0%, 100% { transform: scale(1) } 30% { transform: scale(1.22) } 55% { transform: scale(.96) } }
      @keyframes sp-lift { 0%, 100% { transform: translateY(0) rotate(0) } 40% { transform: translateY(-7px) rotate(-8deg) } 70% { transform: translateY(1px) rotate(2deg) } }
      @keyframes sp-fade { from { opacity: 0 } to { opacity: 1 } }
      @keyframes sp-bar { from { transform: scaleX(0) } to { transform: scaleX(1) } }
      @keyframes sp-float { from { transform: translateY(0) } to { transform: translateY(-34px) } }
      @keyframes sp-zoom { to { transform: scale(1.18); opacity: 0 } }
      @keyframes sp-circle { from { clip-path: circle(0% at 50% 42%) } to { clip-path: circle(125% at 50% 42%) } }
      /* „Bewegung reduzieren": ruhiges Endbild, Wechsel nur per Einblenden */
      @media (prefers-reduced-motion: reduce) {
        #splash, #splash *, #splash::before { animation: none !important; transition: none !important; }
        #splash::before { opacity: 1; }
        .sp-bokeh i { opacity: .6; }
        .sp-pulse, .sp-ic { stroke-dashoffset: 0; }
        .sp-mark { transform: translate(143px, 40px) scale(.2); }
      }
    </style>
    <noscript><style>#splash { display: none; }</style></noscript>

  <body>

    <script>
      // Ablauf: ca. 2,9 s Animation (0,9 s bei „Bewegung reduzieren"), dann öffnet sich die App als Kreis,
      // sobald sie bereit ist. Tippen/Enter/Esc überspringt direkt zum Übergang. Notausgang nach 8 s.
      (function () {
        var el = document.getElementById('splash')
        if (!el) return
        var root = document.documentElement
        var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches
        var minDone = false, ready = !!window.__hlxReady, started = false, gone = false
        function remove() {
          if (gone) return
          gone = true
          root.classList.remove('sp-reveal')
          if (el.parentNode) el.parentNode.removeChild(el)
        }
        function reveal() {
          if (started) return
          started = true
          if (reduce) { el.classList.add('sp-out'); setTimeout(remove, 450); return }
          root.classList.add('sp-reveal')
          el.classList.add('sp-leaving')
          setTimeout(remove, 800)
        }
        function check() { if (minDone && ready) reveal() }
        function skip() { minDone = true; check() }
        setTimeout(skip, reduce ? 900 : 2900)
        setTimeout(reveal, 8000)
        window.addEventListener('app-ready', function () { ready = true; check() })
        el.addEventListener('pointerdown', skip)
        document.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' || e.key === ' ' || e.key === 'Escape') skip()
        })
      })()
    </script>
    <div id="root"></div>
