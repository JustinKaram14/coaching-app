    <style>
      /* Startanimation „HLX Together – Healthy & Athletic". Steht inline, damit sie sichtbar ist,
         noch bevor das App-Bundle geladen ist. Der Hintergrund der Seite gilt nur bis die App-CSS greift. */
      body { background: #075640; }
      #splash {
        position: fixed; inset: 0; z-index: 99999; display: grid; place-items: center; overflow: hidden;
        background: #075640; color: #fff; cursor: pointer;
        font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
        transition: opacity .4s ease, transform .4s ease;
      }
      #splash.sp-out { opacity: 0; transform: scale(1.03); pointer-events: none; }
      #splash::before {
        content: ""; position: absolute; inset: 0; opacity: 0;
        background: radial-gradient(circle at 50% 42%, #0b6f52 0%, #075640 48%, #04392a 100%);
        animation: sp-fade .9s ease-out .1s forwards;
      }
      .sp-art { position: relative; width: auto; height: min(76dvh, 510px); max-width: 90vw; overflow: visible; }
      /* Puls-Linie läuft durchs Bild */
      .sp-pulse {
        fill: none; stroke: #3bd4a6; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round;
        stroke-dasharray: 100; stroke-dashoffset: 100; filter: drop-shadow(0 0 6px rgb(59 212 166 / .7));
        animation: sp-draw .8s cubic-bezier(.4,.1,.2,1) .05s forwards, sp-dim .5s ease 1s forwards;
      }
      /* HLX wächst Balken für Balken nach oben */
      .sp-bar, .sp-barx {
        fill: #fff; transform-box: fill-box; animation-duration: .5s;
        animation-timing-function: cubic-bezier(.2,.9,.25,1.15); animation-fill-mode: both;
      }
      .sp-bar { transform-origin: 50% 100%; animation-name: sp-grow-y; }
      .sp-barx { transform-origin: 0 50%; animation-name: sp-grow-x; }
      .b1 { animation-delay: .45s } .b2 { animation-delay: .53s } .b3 { animation-delay: .66s }
      .b4 { animation-delay: .58s } .b5 { animation-delay: .72s } .b6 { animation-delay: .62s } .b7 { animation-delay: .70s }
      .sp-tg { font-size: 13px; font-weight: 700; letter-spacing: .5em; fill: #c4ecdd; animation: sp-up .5s ease-out .95s both; }
      .sp-ic {
        fill: none; stroke: #3bd4a6; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round;
        stroke-dasharray: 100; stroke-dashoffset: 100; animation: sp-draw .6s ease-out both;
      }
      .ic1 { animation-delay: 1s } .ic2 { animation-delay: 1.18s }
      .sp-lbl { font-size: 14px; font-weight: 800; letter-spacing: .2em; fill: #fff; animation: sp-up .45s ease-out both; }
      .l1 { animation-delay: 1.1s } .l2 { animation-delay: 1.28s }
      .sp-amp {
        font-size: 30px; font-weight: 300; fill: #3bd4a6; transform-box: fill-box; transform-origin: center;
        animation: sp-pop .4s cubic-bezier(.2,1.2,.3,1) 1.15s both;
      }
      .sp-foot {
        position: absolute; left: 0; right: 0; bottom: calc(28px + env(safe-area-inset-bottom, 0px));
        display: grid; justify-items: center; gap: 12px;
      }
      .sp-hint { font-size: 12.5px; font-weight: 600; letter-spacing: .02em; color: #cfeee3; animation: sp-fade .5s ease .7s both; }
      .sp-track { width: 120px; height: 3px; border-radius: 3px; background: rgb(255 255 255 / .18); overflow: hidden; }
      .sp-fill { display: block; height: 100%; background: #3bd4a6; transform-origin: 0 50%; animation: sp-bar 1.6s linear both; }
      @keyframes sp-draw { to { stroke-dashoffset: 0 } }
      @keyframes sp-dim { to { opacity: .5 } }
      @keyframes sp-grow-y { from { transform: scaleY(0) } to { transform: scaleY(1) } }
      @keyframes sp-grow-x { from { transform: scaleX(0) } to { transform: scaleX(1) } }
      @keyframes sp-up { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
      @keyframes sp-pop { from { opacity: 0; transform: scale(.4) } to { opacity: 1; transform: none } }
      @keyframes sp-fade { from { opacity: 0 } to { opacity: 1 } }
      @keyframes sp-bar { from { transform: scaleX(0) } to { transform: scaleX(1) } }
      /* „Bewegung reduzieren": ruhiges Endbild statt Animation */
      @media (prefers-reduced-motion: reduce) {
        #splash, #splash *, #splash::before { animation: none !important; transition: none !important; }
        #splash::before { opacity: 1; }
        .sp-pulse, .sp-ic { stroke-dashoffset: 0; }
      }
    </style>

    <script>
      // Mindestdauer 1,6 s (0,7 s bei „Bewegung reduzieren"); danach weg, sobald die App bereit ist.
      // Tippen/Enter/Esc überspringt die Mindestdauer. Notausgang nach 8 s.
      (function () {
        var el = document.getElementById('splash')
        if (!el) return
        var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches
        var minDone = false, ready = !!window.__hlxReady, gone = false
        function remove() { if (!gone) { gone = true; if (el.parentNode) el.parentNode.removeChild(el) } }
        function hide() { if (!gone) { el.classList.add('sp-out'); setTimeout(remove, 450) } }
        function check() { if (minDone && ready) hide() }
        function skip() { minDone = true; check() }
        setTimeout(skip, reduce ? 700 : 1600)
        setTimeout(hide, 8000)
        window.addEventListener('app-ready', function () { ready = true; check() })
        el.addEventListener('pointerdown', skip)
        document.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' || e.key === ' ' || e.key === 'Escape') skip()
        })
      })()
    </script>
